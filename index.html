<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" sizes="96x96" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>TOTJO Holocron</title>
    <script>
      (function(){
        try {
          var raw = localStorage.getItem('totjo-holocron:reading-settings');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme === 'light') theme = 'light';
            else if (parsed.theme === 'dark') theme = 'dark';
            else if (parsed.theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
